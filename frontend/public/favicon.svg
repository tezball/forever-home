  <!-- Heart (love/pet symbol) -->
  <path d="M50 35 C45 30, 38 30, 38 37 C38 42, 50 50, 50 50 C50 50, 62 42, 62 37 C62 30, 55 30, 50 35" fill="#E57373"/>
