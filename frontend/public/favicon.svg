  <!-- Window left -->
  <rect x="18" y="50" width="15" height="15" fill="#87CEEB" stroke="#2D5A3D" stroke-width="2" rx="1"/>
  <line x1="25.5" y1="50" x2="25.5" y2="65" stroke="#2D5A3D" stroke-width="1"/>
  <line x1="18" y1="57.5" x2="33" y2="57.5" stroke="#2D5A3D" stroke-width="1"/>
  <!-- Window right -->
  <rect x="67" y="50" width="15" height="15" fill="#87CEEB" stroke="#2D5A3D" stroke-width="2" rx="1"/>
  <line x1="74.5" y1="50" x2="74.5" y2="65" stroke="#2D5A3D" stroke-width="1"/>
  <line x1="67" y1="57.5" x2="82" y2="57.5" stroke="#2D5A3D" stroke-width="1"/>
  <!-- Chimney -->
