# Test profile configuration

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:moderation_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for H2 (use Hibernate auto-ddl instead)
spring.flyway.enabled=false
spring.sql.init.mode=never

# Disable Spring AI Ollama auto-configuration for tests
spring.ai.ollama.enabled=false
spring.ai.ollama.init.pull-model-strategy=never

# Disable moderation features in tests (they require Ollama)
moderation.text-enabled=false
moderation.image-enabled=true

# Use mock API endpoint
foreverhome.api.base-url=http://localhost:8080

# Disable shell in tests
spring.shell.interactive.enabled=false

# Disable Docker Compose in tests
spring.docker.compose.enabled=false
