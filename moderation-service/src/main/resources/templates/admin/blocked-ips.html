<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle}">Blocked IPs</title>
</head>
<body>
<main th:fragment="content">
    <div class="space-y-6">
        <!-- Page Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">IP Blocking</h1>
            <form th:action="@{/admin/blocked-ips/cleanup}" method="post" class="inline">
                <button type="submit" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">
                    Cleanup Expired
                </button>
            </form>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
            <span th:text="${error}"></span>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Total Active Blocks</div>
                <div class="text-3xl font-bold text-red-600" th:text="${dashboard.totalActive}">0</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Permanent Blocks</div>
                <div class="text-3xl font-bold text-gray-700" th:text="${dashboard.permanentCount}">0</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Temporary Blocks</div>
                <div class="text-3xl font-bold text-primary" th:text="${dashboard.temporaryCount}">0</div>
            </div>
        </div>

        <!-- Block IP Form -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Block New IP</h2>
            </div>
            <div class="p-6">
                <form th:action="@{/admin/blocked-ips/block}" method="post" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">IP Address</label>
                            <input type="text" name="ipAddress" required placeholder="e.g., 192.168.1.1"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Duration (minutes)</label>
                            <input type="number" name="durationMinutes" value="60" min="1"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
                        <input type="text" name="reason" required placeholder="Reason for blocking"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                    </div>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" name="permanent" value="true" class="rounded border-gray-300">
                            <span class="text-sm text-gray-700">Permanent block</span>
                        </label>
                        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                            Block IP
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Active Blocks -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Active Blocks</h2>
            </div>
            <div th:if="${#lists.isEmpty(dashboard.activeBlocks)}" class="p-6 text-center text-gray-500">
                No active IP blocks
            </div>
            <div th:unless="${#lists.isEmpty(dashboard.activeBlocks)}" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">IP/CIDR</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reason</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Blocked At</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Expires</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="block : ${dashboard.activeBlocks}">
                            <td class="px-6 py-4 whitespace-nowrap font-mono text-sm" th:text="${block.displayAddress}">192.168.1.1</td>
                            <td class="px-6 py-4 text-sm text-gray-500" th:text="${block.reason}">Reason</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(block.blockedAt, 'MMM dd HH:mm')}">Jan 01 12:00</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <span th:if="${block.permanent}" class="text-red-600 font-semibold">Never</span>
                                <span th:unless="${block.permanent}" th:text="${block.expiresAt != null ? #temporals.format(block.expiresAt, 'MMM dd HH:mm') : '-'}">Jan 01 12:00</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:class="'px-2 py-1 text-xs rounded-full ' + (${block.permanent} ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800')"
                                      th:text="${block.permanent ? 'Permanent' : 'Temporary'}">Type</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <form th:action="@{/admin/blocked-ips/{id}/unblock(id=${block.id})}" method="post">
                                    <button type="submit" class="text-green-600 hover:text-green-800 text-sm">Unblock</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
