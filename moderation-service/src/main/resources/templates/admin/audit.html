<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle}">Audit Logs</title>
</head>
<body>
<main th:fragment="content">
    <div class="space-y-6">
        <!-- Page Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Audit Logs</h1>
            <span class="text-sm text-gray-500" th:text="'Total: ' + ${totalCount} + ' entries'">Total: 0 entries</span>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(logs)}" class="bg-white rounded-lg shadow p-12 text-center">
            <div class="text-gray-400 text-lg">No audit logs found</div>
        </div>

        <!-- Audit Logs Table -->
        <div th:unless="${#lists.isEmpty(logs)}" class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Entity</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Details</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="log : ${logs}" class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                            th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01 12:00:00</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 py-1 text-xs font-medium rounded-full"
                                  th:classappend="${log.action.name().contains('APPROVED')} ? 'bg-green-100 text-green-800' :
                                                  (${log.action.name().contains('REJECTED') or log.action.name().contains('SUSPENDED') or log.action.name().contains('DELETED')} ? 'bg-red-100 text-red-800' :
                                                  (${log.action.name().contains('RESET')} ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800'))"
                                  th:text="${log.action}">ACTION</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900" th:text="${log.entityType}">USER</div>
                            <div th:if="${log.entityId}" class="text-xs font-mono text-gray-500" th:text="${log.entityId}">uuid</div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm text-gray-600 max-w-md truncate" th:text="${log.details}">Details</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="flex justify-center space-x-2">
            <a th:if="${page > 1}" th:href="@{/admin/audit(page=${page - 1}, size=${size})}"
               class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                Previous
            </a>
            <span class="px-4 py-2 text-gray-600" th:text="'Page ' + ${page} + ' of ' + ${totalPages}">Page 1 of 1</span>
            <a th:if="${page < totalPages}" th:href="@{/admin/audit(page=${page + 1}, size=${size})}"
               class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                Next
            </a>
        </div>
    </div>
</main>
</body>
</html>
