<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle}">Rate Limits</title>
</head>
<body>
<main th:fragment="content">
    <div class="space-y-6">
        <!-- Page Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Rate Limiting Dashboard</h1>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
            <span th:text="${error}"></span>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Rate Limited IPs</div>
                <div class="text-3xl font-bold text-primary" th:text="${#lists.size(dashboard.rateLimitedIps)}">0</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Blocked IPs</div>
                <div class="text-3xl font-bold text-red-600" th:text="${dashboard.blockedIpsCount}">0</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Rate Limit</div>
                <div class="text-3xl font-bold text-gray-700" th:text="${dashboard.config.requestsPerMinute} + '/min'">100/min</div>
            </div>
        </div>

        <!-- Currently Rate Limited -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Currently Rate Limited IPs</h2>
            </div>
            <div th:if="${#lists.isEmpty(dashboard.rateLimitedIps)}" class="p-6 text-center text-gray-500">
                No IPs currently rate limited
            </div>
            <div th:unless="${#lists.isEmpty(dashboard.rateLimitedIps)}" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">IP Address</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Remaining</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Usage</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Resets At</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="ip : ${dashboard.rateLimitedIps}">
                            <td class="px-6 py-4 whitespace-nowrap font-mono text-sm" th:text="${ip.ipAddress}">127.0.0.1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm" th:text="${ip.remainingTokens} + ' / ' + ${ip.maxTokens}">50/100</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="w-24 bg-gray-200 rounded-full h-2">
                                    <div th:class="'rounded-full h-2 ' + (${ip.usagePercent > 80} ? 'bg-red-500' : 'bg-primary')"
                                         th:style="'width: ' + ${ip.usagePercent} + '%'"></div>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(ip.resetAt, 'HH:mm:ss')}">12:00:00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Whitelist Management -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Rate Limit Whitelist</h2>
            </div>
            <div class="p-6">
                <form th:action="@{/admin/rate-limits/whitelist/add}" method="post" class="flex gap-4 mb-6">
                    <input type="text" name="userId" placeholder="User ID (UUID)" required
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
                        Add to Whitelist
                    </button>
                </form>

                <div th:if="${#lists.isEmpty(whitelistedUsers)}" class="text-center text-gray-500">
                    No users whitelisted
                </div>
                <div th:unless="${#lists.isEmpty(whitelistedUsers)}" class="divide-y divide-gray-200">
                    <div th:each="user : ${whitelistedUsers}" class="py-3 flex justify-between items-center">
                        <div>
                            <div class="font-medium" th:text="${user.name}">User Name</div>
                            <div class="text-sm text-gray-500" th:text="${user.email}">email@example.com</div>
                        </div>
                        <form th:action="@{/admin/rate-limits/whitelist/remove}" method="post">
                            <input type="hidden" name="userId" th:value="${user.id}">
                            <button type="submit" class="text-red-600 hover:text-red-800 text-sm">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
