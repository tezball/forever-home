<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle}">Feature Flags</title>
</head>
<body>
<main th:fragment="content">
    <div class="space-y-6">
        <!-- Page Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Feature Flags</h1>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
            <span th:text="${error}"></span>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Total Flags</div>
                <div class="text-3xl font-bold text-primary" th:text="${summary.total}">0</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Enabled</div>
                <div class="text-3xl font-bold text-green-600" th:text="${summary.enabled}">0</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm text-gray-500">Disabled</div>
                <div class="text-3xl font-bold text-gray-400" th:text="${summary.disabled}">0</div>
            </div>
        </div>

        <!-- Create New Flag -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Create New Flag</h2>
            </div>
            <div class="p-6">
                <form th:action="@{/admin/feature-flags/create}" method="post" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Flag Key</label>
                            <input type="text" name="flagKey" required placeholder="e.g., new_feature_enabled"
                                   pattern="[a-z_]+" title="Lowercase letters and underscores only"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                            <input type="text" name="description" required placeholder="What does this flag control?"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" name="enabled" value="true" class="rounded border-gray-300">
                            <span class="text-sm text-gray-700">Enable on creation</span>
                        </label>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
                            Create Flag
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Flags List -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">All Feature Flags</h2>
            </div>
            <div th:if="${#lists.isEmpty(flags)}" class="p-6 text-center text-gray-500">
                No feature flags defined
            </div>
            <div th:unless="${#lists.isEmpty(flags)}" class="divide-y divide-gray-200">
                <div th:each="flag : ${flags}" class="px-6 py-4">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-3">
                                <span class="font-mono font-semibold text-gray-900" th:text="${flag.flagKey}">flag_key</span>
                                <span th:class="'px-2 py-1 text-xs rounded-full ' + (${flag.enabled} ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600')"
                                      th:text="${flag.enabled ? 'Enabled' : 'Disabled'}">Status</span>
                                <span th:if="${flag.rolloutPercentage != null and flag.rolloutPercentage < 100}"
                                      class="px-2 py-1 text-xs rounded-full bg-yellow-100 text-yellow-800"
                                      th:text="${flag.rolloutPercentage} + '% rollout'">50% rollout</span>
                            </div>
                            <div class="text-sm text-gray-500 mt-1" th:text="${flag.description}">Description</div>
                            <div th:if="${flag.targetRoles != null and not #lists.isEmpty(flag.targetRoles)}"
                                 class="text-xs text-gray-400 mt-1">
                                Roles: <span th:text="${#strings.listJoin(flag.targetRoles, ', ')}">ADMIN, USER</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <!-- Toggle -->
                            <form th:action="@{/admin/feature-flags/{id}/toggle(id=${flag.id})}" method="post" class="inline">
                                <input type="hidden" name="enabled" th:value="${!flag.enabled}">
                                <button type="submit" th:class="'px-3 py-1 text-sm rounded ' + (${flag.enabled} ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-green-100 text-green-700 hover:bg-green-200')">
                                    <span th:text="${flag.enabled ? 'Disable' : 'Enable'}">Toggle</span>
                                </button>
                            </form>
                            <!-- Delete -->
                            <form th:action="@{/admin/feature-flags/{id}/delete(id=${flag.id})}" method="post" class="inline"
                                  onsubmit="return confirm('Are you sure you want to delete this flag?')">
                                <button type="submit" class="px-3 py-1 text-sm rounded bg-gray-100 text-gray-600 hover:bg-gray-200">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </div>
                    <!-- Rollout Control -->
                    <div class="mt-3 flex items-center gap-4">
                        <form th:action="@{/admin/feature-flags/{id}/rollout(id=${flag.id})}" method="post" class="flex items-center gap-2">
                            <label class="text-xs text-gray-500">Rollout:</label>
                            <input type="range" name="percentage" min="0" max="100" step="5"
                                   th:value="${flag.rolloutPercentage}" class="w-24">
                            <input type="number" name="percentage" min="0" max="100"
                                   th:value="${flag.rolloutPercentage}" class="w-16 px-2 py-1 text-xs border rounded">
                            <span class="text-xs text-gray-500">%</span>
                            <button type="submit" class="text-xs text-primary hover:underline">Update</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
