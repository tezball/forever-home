<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle}">Session Management</title>
</head>
<body>
<main th:fragment="content">
    <div class="space-y-6">
        <!-- Page Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Session Management</h1>
            <div class="flex gap-2">
                <form th:action="@{/admin/sessions/cleanup}" method="post" class="inline">
                    <button type="submit" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">
                        Cleanup Expired
                    </button>
                </form>
                <form th:action="@{/admin/sessions/revoke-all}" method="post" class="inline"
                      onsubmit="return confirm('Are you sure you want to revoke ALL sessions? All users will be logged out.')">
                    <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">
                        Revoke All Sessions
                    </button>
                </form>
            </div>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
            <span th:text="${error}"></span>
        </div>

        <!-- Stats -->
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500">Active Sessions</div>
            <div class="text-3xl font-bold text-primary" th:text="${dashboard.activeSessions}">0</div>
        </div>

        <!-- Sessions Table -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Recent Sessions</h2>
            </div>
            <div th:if="${#lists.isEmpty(dashboard.recentSessions)}" class="p-6 text-center text-gray-500">
                No sessions found
            </div>
            <div th:unless="${#lists.isEmpty(dashboard.recentSessions)}" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">User</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Created</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Expires</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="session : ${dashboard.recentSessions}">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="font-medium" th:text="${session.name}">User Name</div>
                                <div class="text-sm text-gray-500" th:text="${session.email}">email@example.com</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-1 text-xs rounded-full bg-gray-100" th:text="${session.role}">ROLE</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(session.createdAt, 'MMM dd HH:mm')}">Jan 01 12:00</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(session.expiresAt, 'MMM dd HH:mm')}">Jan 01 12:00</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:class="'px-2 py-1 text-xs rounded-full ' + (${session.active} ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600')"
                                      th:text="${session.status}">Active</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div th:if="${session.active}" class="flex gap-2">
                                    <form th:action="@{/admin/sessions/{id}/revoke(id=${session.id})}" method="post">
                                        <button type="submit" class="text-red-600 hover:text-red-800 text-sm">Revoke</button>
                                    </form>
                                    <form th:action="@{/admin/sessions/user/{id}/revoke-all(id=${session.userId})}" method="post">
                                        <button type="submit" class="text-orange-600 hover:text-orange-800 text-sm">Revoke All User</button>
                                    </form>
                                </div>
                                <span th:unless="${session.active}" class="text-gray-400 text-sm">-</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
