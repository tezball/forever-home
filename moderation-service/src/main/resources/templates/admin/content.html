<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle}">Content Management</title>
</head>
<body>
<main th:fragment="content">
    <div class="space-y-6">
        <!-- Page Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Content Management</h1>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
            <span th:text="${error}"></span>
        </div>

        <!-- Stats -->
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500">Total Settings</div>
            <div class="text-3xl font-bold text-primary" th:text="${dashboard.totalSettings}">0</div>
        </div>

        <!-- Create New Setting -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Create New Setting</h2>
            </div>
            <div class="p-6">
                <form th:action="@{/admin/content/create}" method="post" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Key</label>
                            <input type="text" name="settingKey" required placeholder="e.g., homepage_title"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <input type="text" name="category" required placeholder="e.g., content"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                            <select name="settingType" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                                <option value="STRING">String</option>
                                <option value="BOOLEAN">Boolean</option>
                                <option value="INTEGER">Integer</option>
                                <option value="JSON">JSON</option>
                                <option value="HTML">HTML</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Value</label>
                        <textarea name="settingValue" required rows="2" placeholder="Setting value"
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description (optional)</label>
                        <input type="text" name="description" placeholder="What is this setting for?"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                    </div>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
                        Create Setting
                    </button>
                </form>
            </div>
        </div>

        <!-- Settings by Category -->
        <div th:each="entry : ${dashboard.settingsByCategory}" class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-900 capitalize" th:text="${entry.key}">Category</h2>
                <span class="text-sm text-gray-500" th:text="${#lists.size(entry.value)} + ' settings'">0 settings</span>
            </div>
            <div class="divide-y divide-gray-200">
                <div th:each="setting : ${entry.value}" class="px-6 py-4">
                    <form th:action="@{/admin/content/update}" method="post" class="space-y-3">
                        <input type="hidden" name="settingKey" th:value="${setting.settingKey}">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-mono text-sm text-gray-900" th:text="${setting.settingKey}">setting_key</div>
                                <div th:if="${setting.description}" class="text-xs text-gray-500 mt-1" th:text="${setting.description}">Description</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-1 text-xs rounded bg-gray-100 text-gray-600" th:text="${setting.settingType}">STRING</span>
                                <button type="submit" class="text-sm text-primary hover:underline">Save</button>
                                <form th:action="@{/admin/content/delete}" method="post" class="inline"
                                      onsubmit="return confirm('Delete this setting?')">
                                    <input type="hidden" name="settingKey" th:value="${setting.settingKey}">
                                    <button type="submit" class="text-sm text-red-600 hover:underline">Delete</button>
                                </form>
                            </div>
                        </div>
                        <div th:switch="${setting.settingType.name()}">
                            <div th:case="'BOOLEAN'">
                                <select name="settingValue" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                    <option value="true" th:selected="${setting.settingValue == 'true'}">True</option>
                                    <option value="false" th:selected="${setting.settingValue == 'false'}">False</option>
                                </select>
                            </div>
                            <div th:case="'INTEGER'">
                                <input type="number" name="settingValue" th:value="${setting.settingValue}"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            </div>
                            <div th:case="'HTML'">
                                <textarea name="settingValue" rows="4" th:text="${setting.settingValue}"
                                          class="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono text-sm"></textarea>
                            </div>
                            <div th:case="'JSON'">
                                <textarea name="settingValue" rows="4" th:text="${setting.settingValue}"
                                          class="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono text-sm"></textarea>
                            </div>
                            <div th:case="*">
                                <input type="text" name="settingValue" th:value="${setting.settingValue}"
                                       class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            </div>
                        </div>
                        <div class="text-xs text-gray-400">
                            Last updated: <span th:text="${#temporals.format(setting.updatedAt, 'MMM dd, yyyy HH:mm')}">Jan 01, 2025 12:00</span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
