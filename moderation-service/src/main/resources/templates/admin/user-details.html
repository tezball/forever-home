<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${pageTitle}">User Details</title>
</head>
<body>
<main th:fragment="content">
    <div class="space-y-6">
        <!-- Page Header -->
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a th:href="@{/admin/users}" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="text-2xl font-bold text-gray-900">User Details</h1>
            </div>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
            <span th:text="${error}"></span>
        </div>

        <!-- User Info Card -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">User Information</h2>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-500">Name</label>
                        <div class="mt-1 text-lg" th:text="${user.displayName}">Name</div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">Email</label>
                        <div class="mt-1 text-lg" th:text="${user.email}">email@example.com</div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">Role</label>
                        <div class="mt-1">
                            <span class="px-3 py-1 text-sm font-medium rounded-full"
                                  th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-purple-100 text-purple-800' :
                                                  (${user.role.name() == 'RESCUE_ORG'} ? 'bg-blue-100 text-blue-800' :
                                                  (${user.role.name() == 'VET'} ? 'bg-green-100 text-green-800' :
                                                  (${user.role.name() == 'FOSTER'} ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800')))"
                                  th:text="${user.role}">ROLE</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">Status</label>
                        <div class="mt-1">
                            <span class="px-3 py-1 text-sm font-medium rounded-full"
                                  th:classappend="${user.status.name() == 'ACTIVE'} ? 'bg-green-100 text-green-800' :
                                                  (${user.status.name() == 'PENDING'} ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800')"
                                  th:text="${user.status}">STATUS</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">Profile Complete</label>
                        <div class="mt-1">
                            <span th:if="${user.profileComplete}" class="text-green-600">Yes</span>
                            <span th:unless="${user.profileComplete}" class="text-gray-400">No</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">Created At</label>
                        <div class="mt-1 text-gray-900" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">Last Login</label>
                        <div class="mt-1 text-gray-900" th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm') : 'Never'}">Never</div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">User ID</label>
                        <div class="mt-1 text-sm font-mono text-gray-500" th:text="${user.id}">uuid</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions Card -->
        <div class="bg-white rounded-lg shadow" th:if="${user.role.name() != 'ADMIN'}">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Actions</h2>
            </div>
            <div class="p-6 space-y-4">
                <!-- Status Actions -->
                <div class="flex flex-wrap gap-4">
                    <form th:if="${user.status.name() == 'ACTIVE'}" th:action="@{/admin/users/{id}/suspend(id=${user.id})}" method="post">
                        <button type="submit" onclick="return confirm('Are you sure you want to suspend this user?')"
                                class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition-colors">
                            Suspend User
                        </button>
                    </form>
                    <form th:if="${user.status.name() == 'SUSPENDED'}" th:action="@{/admin/users/{id}/reactivate(id=${user.id})}" method="post">
                        <button type="submit"
                                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                            Reactivate User
                        </button>
                    </form>
                    <form th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post">
                        <button type="submit" onclick="return confirm('Are you sure you want to reset this user\\'s password?')"
                                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Reset Password
                        </button>
                    </form>
                </div>

                <!-- Danger Zone -->
                <div class="pt-4 border-t border-gray-200">
                    <h3 class="text-sm font-medium text-red-600 mb-4">Danger Zone</h3>
                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post">
                        <button type="submit" onclick="return confirm('Are you sure you want to PERMANENTLY DELETE this user? This action cannot be undone.')"
                                class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                            Delete User Permanently
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Admin Notice -->
        <div th:if="${user.role.name() == 'ADMIN'}" class="bg-purple-50 border border-purple-200 text-purple-800 px-4 py-3 rounded-lg">
            Admin accounts cannot be modified or deleted through this interface.
        </div>
    </div>
</main>
</body>
</html>
