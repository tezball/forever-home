<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Queue Items Fragment - Used for HTMX partial updates -->
<th:block th:fragment="queueItems">
    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(queueItems)}" class="bg-white rounded-lg shadow p-8 text-center">
        <svg class="w-16 h-16 mx-auto text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h3 class="text-lg font-medium text-gray-900 mb-2">Queue is empty!</h3>
        <p class="text-gray-600">No flagged content to review. Great job!</p>
        <a href="/batch" class="inline-block mt-4 px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90">
            Run Batch Moderation
        </a>
    </div>

    <!-- Queue Items -->
    <div th:each="item : ${queueItems}" th:id="|queue-item-${item.result.id}|"
         class="bg-white rounded-lg shadow hover:shadow-md transition-shadow cursor-pointer queue-card"
         th:data-id="${item.result.id}"
         hx-get th:hx-get="|/queue/${item.result.id}/detail|"
         hx-target="#detail-panel"
         hx-swap="innerHTML">

        <!-- Card Header -->
        <div class="p-4 border-b border-gray-100">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <!-- Pet Icon -->
                    <span class="text-2xl" th:text="${item.petSpecies() == 'DOG' ? '🐶' : (item.petSpecies() == 'CAT' ? '🐱' : '🐾')}"></span>
                    <div>
                        <span class="font-medium text-gray-900" th:text="${item.petName()}">Pet Name</span>
                        <span class="mx-2 text-gray-300">|</span>
                        <span th:if="${item.result.contentType.name() == 'TEXT'}"
                              class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">
                            TEXT
                        </span>
                        <span th:if="${item.result.contentType.name() == 'IMAGE'}"
                              class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-purple-100 text-purple-800">
                            IMAGE
                        </span>
                        <span class="text-gray-500 text-sm ml-2" th:text="${item.result.contentIdentifier}">field</span>
                    </div>
                </div>
                <!-- Age Badge -->
                <span th:class="|text-xs px-2 py-1 rounded ${item.ageClass() == 'red' ? 'bg-red-100 text-red-800' : (item.ageClass() == 'amber' ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600')}|"
                      th:text="${item.ageLabel}">2h ago</span>
            </div>
        </div>

        <!-- Severity & Category -->
        <div class="px-4 py-2 flex items-center space-x-2">
            <span th:class="|inline-flex items-center px-2 py-0.5 rounded text-xs font-bold ${item.highestSeverity() == 'HIGH' ? 'bg-red-100 text-red-800' : (item.highestSeverity() == 'MEDIUM' ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600')}|"
                  th:text="${item.highestSeverity()}">HIGH</span>
            <span th:each="flag : ${item.result.flags}"
                  class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-700"
                  th:text="${flag.category.name()}">CATEGORY</span>
        </div>

        <!-- Content Preview -->
        <div class="px-4 py-3">
            <!-- For TEXT content -->
            <div th:if="${item.result.contentType.name() == 'TEXT'}" class="text-sm text-gray-600 line-clamp-2">
                "<span th:text="${item.contentPreview()}">Content preview...</span>"
            </div>
            <!-- For IMAGE content -->
            <div th:if="${item.result.contentType.name() == 'IMAGE'}" class="relative">
                <img th:src="${item.result.contentIdentifier}"
                     class="w-full h-32 object-cover rounded"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23eee%22 width=%22100%22 height=%22100%22/><text fill=%22%23999%22 x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22>No Image</text></svg>'"
                     alt="Pet image">
            </div>
        </div>

        <!-- Meta & Actions -->
        <div class="px-4 py-3 border-t border-gray-100 flex items-center justify-between">
            <div class="flex items-center space-x-4 text-sm text-gray-500">
                <span th:if="${item.result.confidenceScore != null}"
                      th:text="|${#numbers.formatDecimal(item.result.confidenceScore * 100, 1, 0)}% confidence|">87% confidence</span>
            </div>
            <div class="flex space-x-2" onclick="event.stopPropagation()">
                <form th:action="|/queue/${item.result.id}/approve|" method="post" class="inline"
                      hx-post th:hx-post="|/queue/${item.result.id}/approve|"
                      hx-target th:hx-target="|#queue-item-${item.result.id}|"
                      hx-swap="outerHTML">
                    <button type="submit"
                            class="px-3 py-1.5 bg-green-600 text-white text-sm rounded hover:bg-green-700 transition-colors">
                        Approve
                    </button>
                </form>
                <form th:action="|/queue/${item.result.id}/reject|" method="post" class="inline"
                      hx-post th:hx-post="|/queue/${item.result.id}/reject|"
                      hx-target th:hx-target="|#queue-item-${item.result.id}|"
                      hx-swap="outerHTML">
                    <button type="submit"
                            class="px-3 py-1.5 bg-red-600 text-white text-sm rounded hover:bg-red-700 transition-colors">
                        Reject
                    </button>
                </form>
            </div>
        </div>
    </div>
</th:block>

<!-- Fragment for item removal animation -->
<th:block th:fragment="itemRemoved">
    <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-center text-green-700 animate-fade-out">
        Item processed successfully
    </div>
</th:block>
</body>
</html>
