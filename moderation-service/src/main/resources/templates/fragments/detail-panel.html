<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Detail Panel Fragment - Shows full item details -->
<th:block th:fragment="detailPanel">
    <!-- Error State -->
    <div th:if="${error}" class="p-8 text-center">
        <svg class="w-16 h-16 mx-auto text-red-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <p class="text-red-600" th:text="${error}">Error loading item</p>
    </div>

    <!-- Item Detail -->
    <div th:if="${item}" class="divide-y divide-gray-100">
        <!-- Pet Profile Header -->
        <div class="p-4">
            <div class="flex items-start space-x-4">
                <!-- Pet Image -->
                <div class="flex-shrink-0">
                    <div th:if="${item.primaryImageUrl() != null}" class="w-20 h-20 rounded-lg overflow-hidden">
                        <img th:src="${item.primaryImageUrl()}"
                             class="w-full h-full object-cover"
                             onerror="this.parentElement.innerHTML='<div class=\'w-full h-full bg-gray-200 flex items-center justify-center text-3xl\'>🐾</div>'"
                             alt="Pet photo">
                    </div>
                    <div th:if="${item.primaryImageUrl() == null}" class="w-20 h-20 rounded-lg bg-gray-200 flex items-center justify-center">
                        <span class="text-3xl" th:text="${item.petSpecies() == 'DOG' ? '🐶' : (item.petSpecies() == 'CAT' ? '🐱' : '🐾')}"></span>
                    </div>
                </div>
                <!-- Pet Info -->
                <div class="flex-1 min-w-0">
                    <h3 class="text-lg font-semibold text-gray-900" th:text="${item.petName()}">Pet Name</h3>
                    <div th:if="${pet}" class="mt-1 text-sm text-gray-500">
                        <span th:text="${pet.breed()}">Breed</span>
                        <span class="mx-1">•</span>
                        <span th:text="|${pet.age()} ${pet.ageUnit()}|">Age</span>
                        <span class="mx-1">•</span>
                        <span th:text="${pet.sex()}">Sex</span>
                    </div>
                    <div th:if="${pet}" class="mt-2">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                              th:classappend="${pet.status() == 'AVAILABLE' ? 'bg-green-100 text-green-800' :
                                               (pet.status() == 'PENDING_MODERATION' ? 'bg-yellow-100 text-yellow-800' :
                                               'bg-gray-100 text-gray-800')}"
                              th:text="${pet.status()}">Status</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Flagged Content Section -->
        <div class="p-4">
            <h4 class="text-sm font-medium text-gray-900 mb-3">Flagged Content</h4>
            <div class="flex items-center space-x-2 mb-2">
                <span th:if="${item.result.contentType.name() == 'TEXT'}"
                      class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">
                    TEXT
                </span>
                <span th:if="${item.result.contentType.name() == 'IMAGE'}"
                      class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-purple-100 text-purple-800">
                    IMAGE
                </span>
                <span class="text-sm text-gray-500" th:text="${item.result.contentIdentifier}">field</span>
            </div>

            <!-- Text Content -->
            <div th:if="${item.result.contentType.name() == 'TEXT'}"
                 class="bg-gray-50 rounded-lg p-3 text-sm text-gray-700 max-h-32 overflow-y-auto">
                <span th:text="${item.contentPreview()}">Content text...</span>
            </div>

            <!-- Image Content -->
            <div th:if="${item.result.contentType.name() == 'IMAGE'}" class="relative">
                <img th:src="${item.result.contentIdentifier}"
                     class="w-full rounded-lg max-h-48 object-contain bg-gray-100"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22150%22><rect fill=%22%23f3f4f6%22 width=%22200%22 height=%22150%22/><text fill=%22%239ca3af%22 x=%22100%22 y=%2275%22 text-anchor=%22middle%22 dy=%22.3em%22>Image unavailable</text></svg>'"
                     alt="Flagged content">
            </div>
        </div>

        <!-- AI Analysis Section -->
        <div class="p-4">
            <h4 class="text-sm font-medium text-gray-900 mb-3">AI Analysis</h4>

            <!-- Confidence Score -->
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm text-gray-500">Confidence</span>
                <div class="flex items-center">
                    <div class="w-24 h-2 bg-gray-200 rounded-full mr-2">
                        <div class="h-full rounded-full"
                             th:classappend="${item.result.confidenceScore >= 0.8 ? 'bg-green-500' : (item.result.confidenceScore >= 0.5 ? 'bg-yellow-500' : 'bg-red-500')}"
                             th:style="|width: ${item.result.confidenceScore != null ? item.result.confidenceScore * 100 : 0}%|"></div>
                    </div>
                    <span class="text-sm font-medium"
                          th:text="${item.result.confidenceScore != null ? #numbers.formatDecimal(item.result.confidenceScore * 100, 1, 0) + '%' : 'N/A'}">85%</span>
                </div>
            </div>

            <!-- Flags -->
            <div class="space-y-2">
                <div th:each="flag : ${item.result.flags}"
                     class="bg-gray-50 rounded-lg p-3">
                    <div class="flex items-center justify-between mb-1">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-200 text-gray-800"
                              th:text="${flag.category.name()}">CATEGORY</span>
                        <span th:class="|text-xs font-bold ${item.highestSeverity() == 'HIGH' ? 'text-red-600' : (item.highestSeverity() == 'MEDIUM' ? 'text-amber-600' : 'text-gray-600')}|"
                              th:text="${item.highestSeverity()}">HIGH</span>
                    </div>
                    <p th:if="${flag.description}" class="text-sm text-gray-600 mt-1" th:text="${flag.description}">
                        Description of flag...
                    </p>
                </div>
            </div>

            <!-- No flags message -->
            <div th:if="${#lists.isEmpty(item.result.flags)}" class="text-sm text-gray-500 italic">
                No specific flags recorded
            </div>
        </div>

        <!-- Moderation History -->
        <div class="p-4" th:if="${petResults != null && !petResults.isEmpty()}">
            <h4 class="text-sm font-medium text-gray-900 mb-3">Moderation History</h4>
            <div class="space-y-2 max-h-32 overflow-y-auto">
                <div th:each="result : ${petResults}" class="flex items-center justify-between text-sm">
                    <div class="flex items-center space-x-2">
                        <span th:if="${result.status.name() == 'FLAGGED'}" class="w-2 h-2 rounded-full bg-amber-500"></span>
                        <span th:if="${result.status.name() == 'APPROVED'}" class="w-2 h-2 rounded-full bg-green-500"></span>
                        <span th:if="${result.status.name() == 'REJECTED'}" class="w-2 h-2 rounded-full bg-red-500"></span>
                        <span th:if="${result.status.name() == 'PENDING'}" class="w-2 h-2 rounded-full bg-gray-400"></span>
                        <span class="text-gray-600" th:text="${result.contentIdentifier}">field</span>
                    </div>
                    <span class="text-gray-400" th:text="${result.status.name()}">Status</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="p-4 bg-gray-50">
            <div class="flex space-x-3">
                <form th:action="|/queue/${item.result.id}/approve|" method="post" class="flex-1"
                      hx-post th:hx-post="|/queue/${item.result.id}/approve|"
                      hx-target th:hx-target="|#queue-item-${item.result.id}|"
                      hx-swap="outerHTML">
                    <button type="submit"
                            class="w-full px-4 py-2 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 transition-colors">
                        Approve
                    </button>
                </form>
                <form th:action="|/queue/${item.result.id}/reject|" method="post" class="flex-1"
                      hx-post th:hx-post="|/queue/${item.result.id}/reject|"
                      hx-target th:hx-target="|#queue-item-${item.result.id}|"
                      hx-swap="outerHTML">
                    <button type="submit"
                            class="w-full px-4 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 transition-colors">
                        Reject
                    </button>
                </form>
            </div>

            <!-- Secondary Actions -->
            <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-200">
                <form th:action="|/queue/${item.result.id}/rerun|" method="post" class="inline">
                    <button type="submit" class="text-sm text-gray-500 hover:text-gray-700">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Re-run AI
                    </button>
                </form>
                <a th:if="${pet != null}" th:href="|/pet/${pet.id()}|"
                   class="text-sm text-primary hover:text-primary/80">
                    View Full Pet Profile →
                </a>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
