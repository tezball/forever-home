spring.application.name=moderation-service
server.port=8081

# Database Configuration (uses main Forever Home database)
spring.datasource.url=jdbc:postgresql://localhost:5432/foreverhome
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway disabled - migrations managed by main Forever Home app
spring.flyway.enabled=false

# Spring AI - Ollama Configuration
spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.options.model=llama3.2

# Moderation Model Configuration
moderation.text-model=llama3.2
moderation.vision-model=llama3.2-vision
moderation.temperature=0.1

# Feature Flags - enable/disable moderation types
moderation.text-enabled=true
moderation.image-enabled=true

# Debug Mode - enables verbose logging of prompts and LLM responses
moderation.debug=false

# Forever Home API Configuration
foreverhome.api.base-url=http://localhost:8080
foreverhome.api.token=${FOREVERHOME_API_TOKEN:}

# Image URL rewrite for Docker networking
# When running in Docker, image URLs stored as localhost:4566 need to be rewritten
# to use the Docker service name (localstack:4566)
foreverhome.api.image-url-rewrite-from=${FOREVERHOME_API_IMAGE_URL_REWRITE_FROM:}
foreverhome.api.image-url-rewrite-to=${FOREVERHOME_API_IMAGE_URL_REWRITE_TO:}

# Spring Shell Configuration
spring.shell.interactive.enabled=true
spring.shell.noninteractive.enabled=true

# Logging
logging.level.com.example.foreverhome.moderation=DEBUG
logging.level.org.springframework.ai=INFO
