services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=moderation'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5433:5432'
    volumes:
      - moderation-db-data:/var/lib/postgresql/data

  ollama:
    image: 'ollama/ollama:latest'
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama

volumes:
  moderation-db-data:
  ollama-data:
