name: PR Build and Test

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Test, Build & Create GraalVM Native Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Build GraalVM Native Image
        run: ./mvnw native:compile -Pnative -DskipTests

      - name: Upload Native Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forever-home-native-${{ github.event.pull_request.number }}
          path: target/forever-home
          retention-days: 30
          if-no-files-found: error

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forever-home-jar-${{ github.event.pull_request.number }}
          path: target/*.jar
          retention-days: 30
          if-no-files-found: error

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
