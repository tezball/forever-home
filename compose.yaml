services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=foreverhome'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    # Using localstack-persist for S3 data persistence in Community Edition
    # See: https://github.com/GREsau/localstack-persist
    image: gresau/localstack-persist:4
    environment:
      - SERVICES=s3,ses
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - '4566:4566'
    volumes:
      # Persisted data is stored at /persisted-data in the container
      - ./localstack-data:/persisted-data
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.0
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q 'ready'"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'  # Web UI
      - '1025:1025'  # SMTP
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  moderation-service:
    build:
      context: ./moderation-service
      dockerfile: Dockerfile
    ports:
      - '8081:8081'
    environment:
      # Database - use Docker network hostname
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/foreverhome
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      # Ollama - use host machine's Ollama via host.docker.internal
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Forever Home API - use Docker container name when running app in Docker
      - FOREVERHOME_API_BASE_URL=http://forever-home-app:8080
      - FOREVERHOME_API_TOKEN=${FOREVERHOME_API_TOKEN:-}
      # Image URL rewrite: translate localhost S3 URLs to Docker service name
      # This fixes the Docker networking issue where localhost:4566 is unreachable from containers
      - FOREVERHOME_API_IMAGE_URL_REWRITE_FROM=http://localhost:4566
      - FOREVERHOME_API_IMAGE_URL_REWRITE_TO=http://localstack:4566
      # Disable interactive shell in container
      - SPRING_SHELL_INTERACTIVE_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Ollama disabled - using host machine's Ollama instead
  # To re-enable Docker Ollama, uncomment below and change moderation-service
  # SPRING_AI_OLLAMA_BASE_URL back to http://ollama:11434
  # ollama:
  #   build:
  #     context: ./ollama
  #     dockerfile: Dockerfile
  #   ports:
  #     - '11434:11434'
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  prometheus_data:
  # ollama_data:
