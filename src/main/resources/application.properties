spring.application.name=forever-home

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/foreverhome
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true
# WARNING: Setting clean-on-start=true will DROP ALL TABLES on startup!
spring.flyway.clean-on-start=${FLYWAY_CLEAN_ON_START:true}
# Auto-repair checksum mismatches (useful for development when migration files change)
spring.flyway.repair-on-start=${FLYWAY_REPAIR_ON_START:true}

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichMustBeLongEnough256BitsForHS256}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# AWS Configuration (LocalStack for development)
aws.endpoint=http://localhost:4566
aws.region=us-east-1
aws.access-key=test
aws.secret-key=test
aws.s3.bucket=forever-home-images
aws.s3.max-file-size=5242880
aws.s3.allowed-content-types=image/jpeg,image/png,image/gif,image/webp
# SES Configuration Set for email tracking (CloudWatch metrics)
aws.ses.configuration-set=${AWS_SES_CONFIGURATION_SET:}

# Multipart file upload configuration (must match aws.s3.max-file-size)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Application Configuration
app.base-url=http://localhost:8080
app.email.from=noreply@foreverhome.local
app.admin.email=${ADMIN_EMAIL:}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allow-credentials=true
app.cors.max-age=3600

# Email Configuration (Development)
# Provider options: console (log only), smtp (Mailpit), ses (AWS SES)
app.email.provider=${EMAIL_PROVIDER:smtp}
app.email.from=noreply@foreverhome.local

# SMTP settings for Mailpit (local development)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Email Verification (Development Options)
# Set to true to log emails to console instead of sending via SES (legacy, use app.email.provider instead)
app.email.verification.use-console=false
# Set to true to auto-activate users without email verification
app.email.verification.auto-activate=true

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Prometheus metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Custom metrics configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.90,0.95,0.99

# Test Mode (Development Only)
# Set to true to enable test login dropdown with seeded accounts
app.test-mode.enabled=${TEST_MODE_ENABLED:true}
