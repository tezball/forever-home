spring.application.name=forever-home

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/foreverhome
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichMustBeLongEnough256BitsForHS256}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# AWS Configuration (LocalStack for development)
aws.endpoint=http://localhost:4566
aws.region=us-east-1
aws.access-key=test
aws.secret-key=test
aws.s3.bucket=forever-home-images
aws.s3.max-file-size=5242880
aws.s3.allowed-content-types=image/jpeg,image/png,image/gif,image/webp

# Application Configuration
app.base-url=http://localhost:5173
app.email.from=noreply@foreverhome.local
app.admin.email=${ADMIN_EMAIL:}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allow-credentials=true
app.cors.max-age=3600

# Email Verification (Development Options)
# Set to true to log emails to console instead of sending via SES
app.email.verification.use-console=true
# Set to true to auto-activate users without email verification
app.email.verification.auto-activate=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Test Mode (Development Only)
# Set to true to enable test login dropdown with seeded accounts
app.test-mode.enabled=${TEST_MODE_ENABLED:true}
