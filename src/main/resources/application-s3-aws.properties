# AWS S3 Configuration (Real AWS)
# This profile overrides only S3 settings - database, email remain local
#
# Usage:
#   1. Copy .env.example to .env and add your AWS credentials
#   2. Run: ./scripts/run-with-aws-s3.sh
#
# Or manually:
#   export AWS_ACCESS_KEY_ID=your-key
#   export AWS_SECRET_ACCESS_KEY=your-secret
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=s3-aws
#
# Required environment variables:
#   AWS_ACCESS_KEY_ID     - Your AWS access key
#   AWS_SECRET_ACCESS_KEY - Your AWS secret key
#
# Optional environment variables:
#   AWS_REGION            - AWS region (default: eu-west-1)
#   AWS_S3_BUCKET         - S3 bucket name (default: forever-home-images-dev)

# Leave endpoint blank to use real AWS S3 (not LocalStack)
aws.endpoint=
aws.region=${AWS_REGION:eu-west-1}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.bucket=${AWS_S3_BUCKET:forever-home-images-dev}
