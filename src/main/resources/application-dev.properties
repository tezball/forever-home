# Development Configuration for AWS-deployed Forever Home
# Activate this profile with: SPRING_PROFILES_ACTIVE=dev

# Database - Use environment variables (set by ECS Task Definition)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foreverhome}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway - Use same datasource configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Debug - enable to see autoconfigure conditions
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
debug=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichMustBeLongEnough256BitsForHS256}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# AWS Configuration
aws.endpoint=${AWS_ENDPOINT:}
aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:forever-home-images}
aws.s3.max-file-size=5242880
aws.s3.allowed-content-types=image/jpeg,image/png,image/gif,image/webp

# Application Configuration
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.email.from=${EMAIL_FROM:noreply@foreverhome.local}
app.admin.email=${ADMIN_EMAIL:}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allow-credentials=true
app.cors.max-age=3600

# Email Verification - Log to console in dev
app.email.verification.use-console=${APP_EMAIL_VERIFICATION_USE_CONSOLE:true}
app.email.verification.auto-activate=${APP_EMAIL_VERIFICATION_AUTO_ACTIVATE:true}

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Disable mail health indicator (we use SES, not SMTP)
management.health.mail.enabled=false

# Prometheus metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Custom metrics configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.90,0.95,0.99

# Test Mode
app.test-mode.enabled=${TEST_MODE_ENABLED:true}
