# Production Configuration for Forever Home
# Activate this profile with: SPRING_PROFILES_ACTIVE=prod

# Database - Use environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JWT Configuration - MUST be set via environment
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# AWS Configuration
aws.endpoint=${AWS_ENDPOINT:}
aws.region=${AWS_REGION:us-east-1}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.bucket=${AWS_S3_BUCKET:forever-home-images}

# Application Configuration
app.base-url=${APP_BASE_URL}
app.email.from=${EMAIL_FROM:noreply@foreverhome.com}
app.admin.email=${ADMIN_EMAIL}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Email Verification - ENFORCE in production
app.email.verification.use-console=false
app.email.verification.auto-activate=false

# Disable test mode in production
app.test-mode.enabled=false

# Actuator - Restrict in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Disable mail health indicator (we use SES in production, not SMTP)
management.health.mail.enabled=false
